<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Ticket OC POS</title>
  <style>
    @page { size: 58mm auto; margin: 0; }

    html, body {
      margin: 0;
      padding: 0;
      width: 58mm;
      font-family: monospace;
      font-size: 11px;
      color: #000;
      background: #fff;
    }

    .ticket {
      width: 58mm;
      padding: 4mm 3mm;
      box-sizing: border-box;
    }

    .center { text-align: center; }
    .bold { font-weight: bold; }
    .line { border-top: 1px dashed #000; margin: 6px 0; }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }

    .item-name {
      max-width: 34mm;
      word-break: break-word;
    }

    .total {
      font-size: 13px;
      font-weight: bold;
    }

    @media print {
      button { display: none; }
    }
  </style>
</head>

<body>
  <div class="ticket" id="ticket"></div>

  <script>
    function money(value) {
      return "₡" + Number(value || 0).toLocaleString("es-CR");
    }

    function getDemoData() {
      return {
        negocio: "OC POS Demo",
        sucursal: "Sucursal Principal",
        fecha: new Date().toLocaleString("es-CR"),
        cliente: "Contado",
        factura: "Demo-001",
        cajero: "Jose Pablo Badilla",
        subtotal: 1500,
        impuesto: 195,
        total: 1695,
        items: [
          { nombre: "Cafe Americano", cantidad: 1, total: 1500 }
        ]
      };
    }

    const params = new URLSearchParams(window.location.search);
    const raw = params.get("data");

    let data = getDemoData();

    if (raw) {
      try {
        data = JSON.parse(decodeURIComponent(raw));
      } catch (e) {
        console.error("Error leyendo data:", e);
      }
    }

    let html = `
      <div class="center bold">${data.negocio || ""}</div>
      <div class="center">${data.sucursal || ""}</div>
      <div class="center">${data.fecha || ""}</div>

      <div class="line"></div>

      <div>Cliente: ${data.cliente || "Contado"}</div>
      <div>Factura: ${data.factura || ""}</div>
      <div>Cajero: ${data.cajero || ""}</div>

      <div class="line"></div>
    `;

    (data.items || []).forEach(item => {
      html += `
        <div class="row">
          <div class="item-name">${item.cantidad || 1} x ${item.nombre || ""}</div>
          <div>${money(item.total)}</div>
        </div>
      `;
    });

    html += `
      <div class="line"></div>

      <div class="row">
        <div>Subtotal</div>
        <div>${money(data.subtotal)}</div>
      </div>

      <div class="row">
        <div>Impuesto</div>
        <div>${money(data.impuesto)}</div>
      </div>

      <div class="row total">
        <div>Total</div>
        <div>${money(data.total)}</div>
      </div>

      <div class="line"></div>

      <div class="center">Gracias por su compra</div>
      <br>
      <div class="center">OC POS</div>
    `;

    document.getElementById("ticket").innerHTML = html;

    setTimeout(() => {
      window.print();
    }, 700);
  </script>
</body>
</html>
